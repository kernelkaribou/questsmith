services:
  web:
    image: ghcr.io/kernelkaribou/questsmith:dev
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - PUID=1000
      - PGID=1000
      - PIN=1234
      - DATABASE_PATH=/app/data/questsmith.db
      # Set to your local timezone so "complete by" deadlines align to your
      # local calendar date (IANA name, e.g. America/Chicago). Defaults to UTC.
      - TZ=UTC
    restart: unless-stopped
